name: Publish Packages

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write  # Grants OIDC permissions for npm & PyPI Trusted Publishing

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: |
          cd node
          npm ci
          npm run build
      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: ./node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # Or use OIDC if configured on npmjs.com

  publish-pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          cd python
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/

  publish-nuget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: |
          cd csharp
          dotnet pack -c Release -o ./nupkg
      - name: Publish to NuGet
        run: dotnet nuget push ./csharp/nupkg/*.nupkg -k ${{ secrets.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate
