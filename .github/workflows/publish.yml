name: Publish Packages

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write  # Grants OIDC permissions for Trusted Publishing

jobs:
  publish-pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          cd python
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/

  publish-nuget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: |
          cd csharp
          dotnet pack -c Release -o ./nupkg
      - name: Publish to NuGet
        run: dotnet nuget push ./csharp/nupkg/*.nupkg -s https://api.nuget.org/v3/index.json --skip-duplicate
